name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # approve the release pull request's checks
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR needs a lowercase name; github.repository keeps the owner's case.
  IMAGE_NAME: ${{ github.repository }}/airprint

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      released: ${{ steps.release.outputs.release_created || steps.tag.outputs.release_created }}
      version: ${{ steps.release.outputs.version || steps.tag.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release without a manual merge: when release-please opened or updated
      # its pull request, check that branch, merge it, and run release-please
      # again to tag the release. A merge made with GITHUB_TOKEN starts no new
      # workflow run, so tagging and publishing happen in this one.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - name: Check the release branch
        if: ${{ steps.release.outputs.pr }}
        run: |
          addon=$(yq -r '.version' airprint/config.yaml)
          integration=$(jq -r '.version' custom_components/airprint/manifest.json)
          echo "add-on=${addon} integration=${integration}"
          [ "${addon}" = "${integration}" ] || { echo "::error::Versions differ"; exit 1; }
          for script in airprint/*.sh scripts/*.sh; do bash -n "${script}"; done
          python3 -m compileall -q custom_components/airprint
      # Checks on a pull request opened by github-actions[bot] can wait for
      # approval and expire as failed once it is merged: approve them.
      - name: Approve the release pull request's checks
        if: ${{ steps.release.outputs.pr }}
        # env is evaluated even when the step is skipped: pass the raw output
        # and parse it in the script (fromJSON('') would fail every run).
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r .headBranchName <<<"$PR")
          for id in $(gh api "repos/${{ github.repository }}/actions/runs?branch=$BRANCH&status=action_required" --jq '.workflow_runs[].id'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve" || echo "Could not approve run $id"
          done
      - name: Merge the release pull request
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --squash --repo "${{ github.repository }}"
      - uses: googleapis/release-please-action@v5
        id: tag
        if: ${{ steps.release.outputs.pr }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The Supervisor pulls <image>:<version from config.yaml>, so every release
  # needs its add-on image. HACS installs the integration straight from the tag.
  build:
    name: Build ${{ matrix.arch }}
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release-please.outputs.version }}

      - name: Image name
        run: echo "IMAGE=ghcr.io/${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: airprint
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.release-please.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.release-please.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  publish:
    name: Publish
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One image, both architectures
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-aarch64"
