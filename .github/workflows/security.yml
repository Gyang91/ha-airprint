name: Security

# Scans the add-on image for known vulnerabilities (Trivy, OS packages).
# - Fails on fixed-upstream HIGH/CRITICAL findings: those are fixed by
#   rebuilding the image (the Dockerfile applies Debian's security updates).
# - Runs weekly, because new CVEs appear in an image that did not change.
# - Reports go to Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      image:
        description: Scan this published image instead of building one (e.g. ghcr.io/gyang91/ha-airprint/airprint:1.13.0)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  image:
    name: Image vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        if: ${{ !inputs.image }}

      - name: Build the image
        if: ${{ !inputs.image }}
        uses: docker/build-push-action@v7
        with:
          context: airprint
          platforms: linux/amd64
          load: true
          tags: airprint:scan
          cache-from: type=gha,scope=amd64

      - name: Image to scan
        id: target
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: echo "ref=${INPUT_IMAGE:-airprint:scan}" >> "${GITHUB_OUTPUT}"

      # Trivy runs from its official image (pinned), not an install script:
      # one download path less to fail. The Docker socket gives it the image.
      - name: Scan
        id: scan
        env:
          TARGET: ${{ steps.target.outputs.ref }}
          TRIVY: aquasec/trivy:0.70.0
        run: |
          run() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             -v "${PWD}:/out" -v "${HOME}/.cache/trivy:/root/.cache/trivy" "${TRIVY}" "$@"; }
          run image --scanners vuln --format sarif --output /out/trivy.sarif "${TARGET}"
          run image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed             --format table --output /out/trivy.txt "${TARGET}"
          run image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed             --format json --output /out/trivy.json "${TARGET}"
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "fixable=${count}" >> "${GITHUB_OUTPUT}"
          echo "Fixable HIGH/CRITICAL: ${count}"

      - name: Upload to code scanning
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Fixable HIGH/CRITICAL in ${{ steps.target.outputs.ref }}"
            echo '```'
            cat trivy.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          jq -r '.Results[]?.Vulnerabilities[]? | "::warning title=Fixable \(.Severity)::\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) \(.VulnerabilityID)"' trivy.json 2>/dev/null | sort -u | head -45 || true

      - name: Fail on fixable HIGH/CRITICAL
        if: ${{ steps.scan.outputs.fixable != '0' }}
        run: |
          echo "::error::${{ steps.scan.outputs.fixable }} fixable HIGH/CRITICAL vulnerabilities - rebuild the image (the Dockerfile applies Debian's security updates)."
          exit 1
