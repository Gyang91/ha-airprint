name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          addon=$(yq -r '.version' airprint/config.yaml)
          integration=$(jq -r '.version' custom_components/airprint/manifest.json)

          echo "add-on=${addon} integration=${integration}"

          if [ "${addon}" != "${integration}" ]; then
            echo "::error::The add-on and the integration are on different versions. release-please bumps both; do not edit them by hand."
            exit 1
          fi

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats

      - name: They must parse and pass shellcheck
        run: |
          for script in airprint/*.sh scripts/*.sh; do
            bash -n "${script}"
          done
          shellcheck -S warning airprint/*.sh scripts/*.sh

      - name: Tests
        run: bats -r tests

  addon:
    name: Add-on (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: The image must build
        uses: docker/build-push-action@v7
        with:
          context: airprint
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: airprint:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # The snmp backend's discovery opens 9100 and wakes printers (CLAUDE.md).
      - name: No snmp backend, and cupsd accepts the configuration
        run: |
          docker run --rm --entrypoint sh airprint:test -c '
            if [ -e /usr/lib/cups/backend/snmp ]; then
              echo "::error::the CUPS snmp backend is in the image"; exit 1
            fi
            cupsd -t -c /usr/share/airprint/cupsd.conf -s /etc/cups/cups-files.conf'

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: It must compile
        run: python -m compileall -q custom_components/airprint

      - name: Tests
        run: |
          pip install -q -r requirements_test.txt
          pytest

      - uses: home-assistant/actions/hassfest@master

      - uses: hacs/action@main
        with:
          category: integration
