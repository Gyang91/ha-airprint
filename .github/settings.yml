repository:
  name: 'ha-airprint'
  description: 'Home Assistant - AirPrint'
  homepage: 'https://www.aaronfagan.ca/blog/2026/airprint-for-home-assistant/'
  default_branch: 'main'
  private: false
  has_issues: true
  has_wiki: false
  has_downloads: false
  has_projects: false
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  # Pull requests merged by hand. Merges made by the workflows (auto-merge,
  # release) delete their branch themselves.
  delete_branch_on_merge: true

labels:
  - name: 'bug'
    color: 'CC0000'
  - name: 'feature'
    color: '336699'
  # - name: 'first-timers-only'
  #   oldname: 'Help Wanted' # Include if renaming
