name: AirPrint
version: 1.15.4
slug: airprint
description: AirPrint bridge for network printers that do not support it
url: https://github.com/Gyang91/ha-airprint
image: ghcr.io/gyang91/ha-airprint/airprint
arch:
  - amd64
  - aarch64
init: true
boot: auto
startup: services
host_network: true
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Printer status API, used by the AirPrint integration
map:
  - addon_config:rw
  - share:rw
options:
  printers: []
  networks: []
schema:
  printers:
    - icon: list(🖨️|📠|📄|📁|☁️|🏢|🏠)?
      name: str
      location: str?
      device: str?
      driver: url?
  networks:
    - match(^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$)
