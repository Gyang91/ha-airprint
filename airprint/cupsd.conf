LogLevel warn
MaxLogSize 0
IdleExitTimeout 0
# A switched-off printer (smart plug, fingerbot) needs a few minutes to be
# switched on and boot. The default 5 retries x 30 s gave up after 2.5 min;
# 40 x 30 s keeps a job waiting for 20 min.
JobRetryInterval 30
JobRetryLimit 40
Listen 0.0.0.0:631
Browsing On
BrowseLocalProtocols dnssd
DefaultAuthType Basic
WebInterface Yes

# Printing. run.sh adds one "Allow" line per network in the "networks" option
# (a VPN subnet, say) at the marker. /admin below stays local-only.
<Location />
  Order allow,deny
  Allow @LOCAL
  # @NETWORKS@
</Location>

<Location /admin>
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow @LOCAL
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # CUPS-Get-Devices runs every backend's discovery, and the snmp backend's
  # opens the printer's raw port 9100: a Canon wakes and beeps. Anyone who
  # could print used to trigger it, for example from the web interface's
  # "Add Printer" page.
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  # Printer control, as in CUPS' own default policy. Without this block these
  # fell under "Limit All" below: anyone allowed to print could pause the
  # printer, make it reject jobs or cancel every job, without signing in.
  # The add-on's own lpadmin runs as root on the local socket (@SYSTEM).
  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
