[server]
host-name=home-assistant
deny-interfaces=lo,docker0,hassio
use-ipv4=yes
use-ipv6=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
# IPv4 only, like use-ipv6=no. By default Avahi still publishes the host's
# IPv6 address (AAAA over IPv4). A phone that cannot reach that address
# (IPv6 from a Thread border router, say) times out and hides the printer.
publish-aaaa-on-ipv4=no
publish-hinfo=no
publish-workstation=no
